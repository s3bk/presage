[workspace]
members = ["presage", "presage-cli", "presage-store-sqlite"]
resolver = "2"

[patch.crates-io]
sqlx = { git = "https://github.com/s3bk/sqlx", rev = "8da37b61" }
sqlx-core = { git = "https://github.com/s3bk/sqlx", rev = "8da37b61" }
sqlx-sqlite = { git = "https://github.com/s3bk/sqlx", rev = "8da37b61" }
sqlx-macros = { git = "https://github.com/s3bk/sqlx", rev = "8da37b61" }
sqlx-macros-core = { git = "https://github.com/s3bk/sqlx", rev = "8da37b61" }
quickcheck_async = { git = 'https://github.com/nytopop/quickcheck_async', rev = '76b13525ca93e0725e757f841fc6ccab8bae1913' }
libsqlite3-sys = { version = "0.38.0", git = "https://github.com/s3bk/rusqlite", rev = 'd0b2990' }

